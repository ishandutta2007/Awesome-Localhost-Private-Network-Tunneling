<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Tunnel Tube Gradients -->
    <linearGradient id="cyanTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="purpleTube" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Waves in Background -->
  <g opacity="0.22">
    <path d="M 0,220 Q 300,160 600,220 T 1200,220 L 1200,360 L 0,360 Z" fill="#0284c7">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0,220 Q 300,160 600,220 T 1200,220 L 1200,360 L 0,360 Z;
                M 0,240 Q 300,290 600,200 T 1200,240 L 1200,360 L 0,360 Z;
                M 0,220 Q 300,160 600,220 T 1200,220 L 1200,360 L 0,360 Z" />
    </path>
    <path d="M 0,260 Q 400,310 800,230 T 1200,270 L 1200,360 L 0,360 Z" fill="#6366f1">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0,260 Q 400,310 800,230 T 1200,270 L 1200,360 L 0,360 Z;
                M 0,230 Q 400,190 800,280 T 1200,240 L 1200,360 L 0,360 Z;
                M 0,260 Q 400,310 800,230 T 1200,270 L 1200,360 L 0,360 Z" />
    </path>
  </g>

  <!-- Grid Pattern Overlay for High-Tech Developer Ingress aesthetic -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Animated Tunnel Pathway Graphics (Bottom Half) -->
  <g opacity="0.9">
    <!-- Outer Tunnel Pipeline -->
    <path d="M 120 280 C 320 230, 480 320, 600 280 C 720 240, 880 330, 1080 280" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round" />
    
    <!-- Neon Flowing Stream 1 (Forward Ingress) -->
    <path d="M 120 280 C 320 230, 480 320, 600 280 C 720 240, 880 330, 1080 280" fill="none" stroke="url(#cyanTube)" stroke-width="4" stroke-dasharray="14, 10">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="3s" repeatCount="indefinite" />
    </path>

    <!-- Neon Flowing Stream 2 (Reverse Proxy / Return Egress) -->
    <path d="M 1080 305 C 880 345, 720 260, 600 305 C 480 345, 320 260, 120 305" fill="none" stroke="url(#purpleTube)" stroke-width="3" stroke-dasharray="10, 8">
      <animate attributeName="stroke-dashoffset" from="0" to="180" dur="2.5s" repeatCount="indefinite" />
    </path>

    <!-- Animated Data Packets -->
    <circle r="5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 120 280 C 320 230, 480 320, 600 280 C 720 240, 880 330, 1080 280" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle r="4.5" fill="#f43f5e" filter="url(#glow)">
      <animateMotion path="M 1080 305 C 880 345, 720 260, 600 305 C 480 345, 320 260, 120 305" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Localhost Endpoint Node (Left) -->
    <g transform="translate(120, 280)">
      <circle r="14" fill="none" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="10;22;10" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle r="8" fill="#0284c7" />
      <circle r="3.5" fill="#ffffff" />
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LOCALHOST:PORT</text>
    </g>

    <!-- Edge Gateway Central Relay Node (Center) -->
    <g transform="translate(600, 280)">
      <polygon points="0,-15 13,0 0,15 -13,0" fill="#0f172a" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="2s" repeatCount="indefinite" />
      </polygon>
      <circle r="3" fill="#38bdf8" />
      <text x="0" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">ENCRYPTED TUNNEL</text>
    </g>

    <!-- Public Internet Edge Node (Right) -->
    <g transform="translate(1080, 280)">
      <circle r="14" fill="none" stroke="#a855f7" stroke-width="2">
        <animate attributeName="r" values="10;22;10" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle r="8" fill="#9333ea" />
      <circle r="3.5" fill="#ffffff" />
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PUBLIC EDGE / HTTPS</text>
    </g>
  </g>

  <!-- Foreground Header & Content (Crisp, High Contrast, Fully Legible) -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 36)">
      <rect width="255" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="127" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ CURATED AWESOME LIST 🌐</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="112" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Localhost Tunneling</text>

    <!-- Subtitle -->
    <text x="0" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Reverse Proxies • Secure Ingress • Webhook Relays • Self-Hosted NAT Traversal</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 178)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="67" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 Zero-Trust Ingress</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="72" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ NAT Hole Punching</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(300, 0)">
        <rect width="130" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="65" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🪟 Webhook Testing</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(440, 0)">
        <rect width="150" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="75" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛠️ Self-Hosted Proxies</text>
      </g>
    </g>
  </g>
</svg>
