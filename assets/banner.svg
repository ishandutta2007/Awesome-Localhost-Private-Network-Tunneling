<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2e" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Tunnel Neon Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f355da" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing & flowing tunnel animations */
    @keyframes pulseRing {
      0% { r: 12px; opacity: 0.8; stroke-width: 2px; }
      50% { r: 28px; opacity: 0.2; stroke-width: 1px; }
      100% { r: 12px; opacity: 0.8; stroke-width: 2px; }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes packetMove1 {
      0% { cx: 160px; cy: 260px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 1040px; cy: 260px; opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { cx: 1040px; cy: 295px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 160px; cy: 295px; opacity: 0; }
    }
    .tunnel-flow-1 {
      stroke-dasharray: 12, 10;
      animation: flowDash 3s linear infinite;
    }
    .tunnel-flow-2 {
      stroke-dasharray: 8, 8;
      animation: flowDash 2s linear infinite reverse;
    }
    .pulse-node {
      animation: pulseRing 3s ease-in-out infinite;
      transform-origin: center;
    }
    .packet-1 {
      animation: packetMove1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .packet-2 {
      animation: packetMove2 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .beacon {
      animation: beaconBlink 2.5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid lines background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Tunnel Pathways (Lower Layer) -->
  <g opacity="0.85">
    <!-- Outer Tunnel Tube -->
    <path d="M 160 260 C 350 210, 480 300, 600 260 C 720 220, 850 310, 1040 260" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" />
    
    <!-- Neon Pathway Primary -->
    <path d="M 160 260 C 350 210, 480 300, 600 260 C 720 220, 850 310, 1040 260" fill="none" stroke="url(#cyan-glow)" stroke-width="4" filter="url(#soft-glow)" class="tunnel-flow-1" />

    <!-- Reverse Proxy Return Channel -->
    <path d="M 1040 295 C 850 340, 720 255, 600 295 C 480 335, 350 250, 160 295" fill="none" stroke="url(#purple-glow)" stroke-width="3" filter="url(#soft-glow)" class="tunnel-flow-2" />

    <!-- Moving Data Packets -->
    <circle class="packet-1" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
    <circle class="packet-2" r="4.5" fill="#f43f5e" filter="url(#soft-glow)" />

    <!-- Localhost Endpoint Node (Left) -->
    <g transform="translate(160, 260)">
      <circle class="pulse-node" cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" />
      <circle cx="0" cy="0" r="9" fill="#0284c7" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
      <text x="-4" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LOCALHOST:PORT</text>
    </g>

    <!-- Edge Gateway Central Hub -->
    <g transform="translate(600, 260)" class="beacon">
      <polygon points="0,-16 14,0 0,16 -14,0" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
      <text x="0" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">ENCRYPTED TUNNEL</text>
    </g>

    <!-- Public Internet / Cloud Edge Endpoint Node (Right) -->
    <g transform="translate(1040, 260)">
      <circle class="pulse-node" cx="0" cy="0" r="16" fill="none" stroke="#a855f7" />
      <circle cx="0" cy="0" r="9" fill="#9333ea" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
      <text x="4" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PUBLIC EDGE / HTTPS</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitles (High contrast & clean foreground) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="-145" y="-30" width="290" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <text x="0" y="-12" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED AWESOME LIST 🌐</text>

    <!-- Main Title -->
    <text x="0" y="40" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome Localhost &amp; Private Network Tunneling</text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">Reverse Proxies • Secure Ingress • Webhook Relays • Self-Hosted NAT Traversal</text>
  </g>
</svg>